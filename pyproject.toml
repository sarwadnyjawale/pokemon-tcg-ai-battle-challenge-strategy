[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcgabc"
version = "0.1.0"
description = "PTCG AI Battle Challenge — verified data + simulator foundation for the Strategy track"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
sim = ["kaggle-environments>=1.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]